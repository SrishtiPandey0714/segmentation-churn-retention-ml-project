services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crip-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MODEL_PATH=src/models/churn_model.pkl
      - DATABASE_URL=postgresql://user:password@db:5432/crip_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: crip-frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: crip-network
